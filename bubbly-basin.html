<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Bubbly Basin DLC | NLPokopia</title>

    <link rel="stylesheet" href="styles.css?v=9">
</head>

<body>

    <header class="main-header">

        <nav class="main-nav">

            <a href="index.html" class="nav-brand">
                <span class="brand-ball"></span>

                <span class="brand-text">
                    <strong>NLPokopia</strong>
                    <small>Jouw Nederlandse gids voor Pokémon Pokopia</small>
                </span>
            </a>

            <div class="nav-links">

                <a href="index.html">
                    <span>🏠</span>
                    Home
                </a>

                <a href="hoofdpokedex.html">
                    <span>🔴</span>
                    Pokémon
                </a>

                <a href="habitats.html">
                    <span>🌿</span>
                    Habitat
                </a>

                <a href="bubbly-basin.html">
                    <span>💧</span>
                    DLC
                </a>

                <a href="tips.html">
                    <span>💡</span>
                    Tips
                </a>

                <a href="index.html#favorieten">
                    <span>❤️</span>
                    Favorieten
                </a>

            </div>

            <div class="nav-search">
                <input
                    type="search"
                    placeholder="Zoek Pokémon..."
                    aria-label="Zoek Pokémon"
                >
                <span>⌕</span>
            </div>

        </nav>

        <div class="type-dna-bar">
            <img
                src="type-dna.png"
                alt=""
                class="type-dna-image"
                aria-hidden="true"
            >
        </div>

    </header>


    <main class="pokedex-page">

        <a
            href="index.html"
            class="back-button"
        >
            ← Terug naar NLPokopia
        </a>


        <section class="pokedex-intro">

            <span class="pokedex-kicker">
                🫧 Bubbly Basin DLC
            </span>

            <h1>
                Bubbly Basin Pokédex
            </h1>

            <p>
                Ontdek alle 50 Pokémon uit Bubbly Basin.
                Bekijk waar je ze kunt vinden, wat ze kunnen
                en hoe je ze aan jouw Pokopia toevoegt.
            </p>

        </section>


        <section class="search-bar">

            <input
                type="text"
                id="searchInput"
                placeholder="Zoek een Bubbly Basin Pokémon, bijvoorbeeld Shellder of 001"
            >

        </section>


        <section class="filters">

            <select id="typeFilter">

                <option value="all">
                    Alle types
                </option>

            </select>

        </section>


        <section id="app">

            <!-- Bubbly Basin Pokémon worden hier geladen -->

        </section>

    </main>


<script src="pokemon-dlc.js"></script>
<script src="favorites.js?v=1"></script>
<script src="bubbly-basin.js?v=3"></script>

</body>

</html>
