<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Favorieten | NLPokopia</title>

    <link rel="stylesheet" href="styles.css?v=9">
</head>


<body>

<header class="main-header">

    <nav class="main-nav">

        <a href="index.html" class="nav-brand">

            <span class="brand-ball"></span>

            <span class="brand-text">
                <strong>NLPokopia</strong>
                <small>
                    Jouw Nederlandse gids voor Pokémon Pokopia
                </small>
            </span>

        </a>


        <div class="nav-links">

            <a href="index.html">
                <span>🏠</span>
                Home
            </a>

            <a href="hoofdpokedex.html">
                <span>🔴</span>
                Pokémon
            </a>

            <a href="habitats.html">
                <span>🌿</span>
                Habitat
            </a>

            <a href="bubbly-basin.html">
                <span>💧</span>
                DLC
            </a>

            <a href="tips.html">
                <span>💡</span>
                Tips
            </a>

            <a href="favorieten.html">
                <span>❤️</span>
                Favorieten
            </a>

        </div>


        <div class="nav-search">

            <input
                type="search"
                placeholder="Zoek Pokémon..."
                aria-label="Zoek Pokémon"
            >

            <span>⌕</span>

        </div>

    </nav>


    <div class="type-dna-bar">

        <img
            src="type-dna.png"
            alt=""
            class="type-dna-image"
            aria-hidden="true"
        >

    </div>

</header>



<main class="pokedex-page favorites-page">


    <section class="pokedex-intro">

        <a
            href="index.html"
            class="back-button"
        >
            ← Terug naar Home
        </a>


        <p class="section-kicker">
            ❤️ Favorieten
        </p>


        <h1>
            Mijn favoriete Pokémon
        </h1>


        <p>
            Hier vind je alle Pokémon die je als
            favoriet hebt opgeslagen.
        </p>


        <p>
            Klik op ❤️ om een Pokémon weer uit
            je favorieten te verwijderen.
        </p>


        <div class="pokedex-controls">

            <input
                type="search"
                id="searchInput"
                placeholder="Zoek in je favorieten..."
                aria-label="Zoek in je favorieten"
            >


            <select
                id="sectionFilter"
                aria-label="Filter op Pokédex"
            >

                <option value="all">
                    Alle Pokémon
                </option>

                <option value="base">
                    Hoofd-Pokédex
                </option>

                <option value="event">
                    Special Pokémon
                </option>

                <option value="dlc">
                    Bubbly Basin DLC
                </option>

            </select>


            <select
                id="typeFilter"
                aria-label="Filter op type"
            >

                <option value="all">
                    Alle types (All Types)
                </option>

            </select>

        </div>

    </section>



    <main id="app"></main>


</main>



<script src="pokemon-kanto.js"></script>
<script src="pokemon-extra.js"></script>
<script src="pokemon-dlc.js"></script>
<script src="pokemon-data.js"></script>

<script src="favorites.js?v=1"></script>
<script src="favorieten.js?v=1"></script>


</body>

</html>
