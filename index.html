<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NLPokopia</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header>
        <h1>NLPokopia</h1>
        <p>Jouw Nederlandse gids voor Pokémon Pokopia</p>
    </header>
<section class="dlc-info">
    <h2>Bubbly Basin DLC</h2>
    <p>
        Bubbly Basin is sinds 5 augustus 2026 beschikbaar en heeft een eigen
        Pokédex met 50 nieuwe Pokémon en 36 habitats.
    </p>
</section>
    
    <section class="search-bar">
        <input
            type="text"
            id="searchInput"
            placeholder="Zoek op naam of nummer, bijvoorbeeld Bulbasaur of 001"
        >
    </section>
<section class="filters">
    <select id="gameFilter">
    <option value="all">Alles</option>
    <option value="base">Base Game</option>
    <option value="dlc">DLC</option>
    <option value="unknown">Nog onbekend</option>
</select>

<select id="typeFilter">
    <option value="all">Alle types</option>
</select>
</section>
    <main id="app">
        <!-- Hier komen automatisch de Pokémon -->
    </main>

<script src="pokemon-kanto.js"></script>
<script src="pokemon-extra.js"></script>
<script src="pokemon-dlc.js"></script>
<script src="pokemon-data.js"></script>
<script src="app.js"></script>

</body>
</html>
